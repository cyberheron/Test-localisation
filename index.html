<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test GPS</title>
</head>

<body>
  <h1>📍 Test de localisation</h1>

  <button onclick="localiser()">Ma position</button>

  <p id="resultat">Appuie sur le bouton.</p>

  <script>
    function localiser() {
      const resultat = document.getElementById("resultat");

      if (!navigator.geolocation) {
        resultat.textContent = "La géolocalisation n'est pas disponible.";
        return;
      }

      resultat.textContent = "Demande de localisation...";

      navigator.geolocation.getCurrentPosition(
        function(position) {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          const precision = position.coords.accuracy;

          resultat.innerHTML =
            "Latitude : " + lat + "<br>" +
            "Longitude : " + lon + "<br>" +
            "Précision : environ " + Math.round(precision) + " m";
        },

        function() {
          resultat.textContent =
            "❌ Localisation refusée ou indisponible.";
        }
      );
    }
  </script>
</body>
		</html>
