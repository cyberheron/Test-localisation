<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test de localisation</title>
</head>

<body>
  <h1>📍 Test de localisation</h1>

  <p>Appuie sur le bouton pour partager ta position.</p>

  <button onclick="localiser()">Ma position</button>

  <p id="resultat">En attente...</p>

  <script>
    function localiser() {
      const resultat = document.getElementById("resultat");

      if (!navigator.geolocation) {
        resultat.textContent =
          "La géolocalisation n'est pas disponible.";
        return;
      }

      resultat.textContent = "Demande de localisation...";

      navigator.geolocation.getCurrentPosition(
        async function(position) {

          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

          resultat.innerHTML =
            "📍 Position obtenue !<br><br>" +
            "Latitude : " + lat + "<br>" +
            "Longitude : " + lon;

          try {
            const reponse = await fetch(
              "https://4c64d064-7a41-46a3-83cb-1b870f7b4b21-00-2tv1me04913pd.archer.replit.dev/location",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  lat: lat,
                  lon: lon
                })
              }
            );

            if (reponse.ok) {
              resultat.innerHTML +=
                "<br><br>✅ Position envoyée au serveur !";
            } else {
              resultat.innerHTML +=
                "<br><br>❌ Le serveur a refusé la requête.";
            }

          } catch (erreur) {
            resultat.innerHTML +=
              "<br><br>❌ Impossible de contacter le serveur.";
          }
        },

        function(error) {
          resultat.textContent =
            "❌ Localisation refusée ou indisponible.";
        }
      );
    }
  </script>

</body>
</html>
